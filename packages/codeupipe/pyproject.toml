[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codeupipe"
version = "0.1.0"
description = "Payload, Filter, Pipeline: composable pipelines you run observable and export as plain code"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
# Optional in core, and guarded: Payload serde.
msgpack = ["msgpack"]

[tool.setuptools.packages.find]
include = ["codeupipe*"]
