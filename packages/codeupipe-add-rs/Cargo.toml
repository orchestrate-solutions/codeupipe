[package]
name = "codeupipe-add"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "codeupipe add: makes the files of a component (conformance/ADD.md)."
license = "Apache-2.0"
repository = "https://github.com/orchestrate-solutions/codeupipe"
readme = "README.md"
keywords = ["pipeline", "filter", "scaffold", "codeupipe"]
# Not on crates.io yet. A version below 1.0 is not stable.
publish = false

[[bin]]
name = "codeupipe-add"
path = "src/main.rs"

[features]
default = ["layout"]
# `--layout` reads YAML, and Rust has no YAML or JSON reader in its standard
# library (conformance/ADD.md, decision 3). Without the feature, the command
# makes one component, with no dependency beyond the runtime.
layout = ["dep:yaml-rust2"]

[dependencies]
codeupipe = { path = "../codeupipe-rs" }
yaml-rust2 = { version = "0.10", optional = true }

# A workspace of its own, as the linter and the compiler have theirs.
[workspace]
