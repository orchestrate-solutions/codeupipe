[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codeupipe-lint"
version = "1.0.0"
description = "Lint rules for codeupipe pipelines."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Joshua Wink"}]
keywords = ["codeupipe", "lint", "pipeline"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["codeupipe==1.0.0"]

[project.urls]
Homepage = "https://github.com/orchestrate-solutions/codeupipe"
Repository = "https://github.com/orchestrate-solutions/codeupipe"
Issues = "https://github.com/orchestrate-solutions/codeupipe/issues"

[tool.setuptools.packages.find]
include = ["codeupipe_lint*"]
