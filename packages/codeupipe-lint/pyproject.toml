[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codeupipe-lint"
version = "1.0.0"
description = "Lint for codeupipe: anonymous steps, changes to a Payload behind its API, State reads, and writes outside a Filter"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["codeupipe==1.0.0"]

[tool.setuptools.packages.find]
include = ["codeupipe_lint*"]
