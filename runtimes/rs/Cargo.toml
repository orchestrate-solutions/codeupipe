[package]
name = "codeupipe-core"
version = "0.1.0"
edition = "2021"
description = "codeupipe core pipeline primitives — Rust port"
license = "Apache-2.0"
keywords = ["pipeline", "filter", "payload", "codeupipe", "wasm"]

[features]
default = []
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "js-sys", "web-sys", "console_error_panic_hook"]

[lib]
name = "codeupipe_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cup_runner"
path = "src/bin/cup_runner.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# WASM dependencies — only compiled with --features wasm
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["console", "Performance", "Window"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
