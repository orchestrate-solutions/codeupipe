name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/codeupipe -e packages/codeupipe-lint -r requirements-dev.txt
      - name: Tests
        run: python -m pytest tests -q
      - name: Lint, anonymous steps
        run: python -m codeupipe_lint.anonymous_steps
      - name: Lint, invariants
        run: python -m codeupipe_lint.invariants --strict
      - name: Conformance
        run: python conformance/run.py

  typescript:
    name: TypeScript packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Example
        run: node packages/codeupipe-ts/examples/pricing/main.ts
      - name: The linter on the TypeScript code of this repository
        run: npm run lint -w codeupipe-lint
      - name: Conformance
        run: python conformance/run.py typescript:run typescript:static
      - name: The packages as npm makes them
        run: npm pack --workspaces --dry-run

  rust:
    name: Rust packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The runner image has rustup and a stable toolchain. Nothing is
      # downloaded from crates.io: the crates have no dependencies.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --offline --all-targets -- -D warnings
      - name: Tests
        run: cargo test --offline
      - name: Example
        run: cargo run --offline --example pricing -p codeupipe
      - name: Conformance
        run: python conformance/run.py rust:run
      - name: The oldest Rust that the crate supports (rust-version)
        run: |
          rustup toolchain install 1.75 --profile minimal
          cargo +1.75 test --offline -p codeupipe

  export:
    name: Export against dynamic run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/codeupipe -e packages/codeupipe-lint -r requirements-dev.txt
      - name: 2,000 random pipelines
        run: python -m scorecard.differential --count 2000

  packages:
    name: Build and install the packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the wheels
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps -w dist packages/codeupipe packages/codeupipe-lint
      - name: Install the wheels in a new environment
        run: |
          python -m venv /tmp/installed
          /tmp/installed/bin/python -m pip install dist/*.whl
      - name: Use the installed packages, outside the repository
        working-directory: /tmp
        run: |
          /tmp/installed/bin/python -c "import codeupipe, codeupipe_lint; print(sorted(codeupipe.__all__))"
          /tmp/installed/bin/python -m codeupipe_lint.invariants --rules
          /tmp/installed/bin/python -m codeupipe_lint.anonymous_steps --rules

  benchmark:
    name: Benchmark (numbers only, never fails the run)
    runs-on: ubuntu-latest
    # A shared CI machine is too noisy to judge speed, so nothing here is
    # compared with a baseline. The job measures and keeps the numbers: in
    # the job summary and as an artifact.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/codeupipe -e packages/codeupipe-lint -r requirements-dev.txt
      - name: Measure
        run: |
          set -o pipefail
          python conformance/bench.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: conformance/results/bench-latest.*
