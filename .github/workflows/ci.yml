name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/codeupipe -e packages/codeupipe-lint -r requirements-dev.txt
      - name: Tests
        run: python -m pytest tests -q
      - name: Lint, anonymous steps
        run: python -m codeupipe_lint.anonymous_steps
      - name: Lint, invariants
        run: python -m codeupipe_lint.invariants --strict
      - name: Conformance
        run: python conformance/run.py

  typescript:
    name: TypeScript packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Example
        run: node packages/codeupipe-ts/examples/pricing/main.ts
      - name: The linter on the TypeScript code of this repository
        run: npm run lint -w codeupipe-lint
      - name: Install the Python package, for the judge
        # conformance/run.py is a codeupipe pipeline (conformance/judging/).
        run: python -m pip install -e packages/codeupipe
      - name: Conformance
        run: python conformance/run.py typescript:run typescript:static
      - name: codeupipe add, judged by the cases of conformance/ADD.md
        run: python conformance/add.py typescript:add
      - name: The packages as npm makes them
        run: npm pack --workspaces --dry-run

  rust:
    name: Rust packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The runner image has rustup and a stable toolchain. Nothing is
      # downloaded from crates.io: the crates have no dependencies.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --offline --all-targets -- -D warnings
      - name: Tests
        run: cargo test --offline
      - name: Examples
        run: |
          cargo run --offline --example pricing -p codeupipe
          cargo run --offline --example typed_pricing -p codeupipe
      - name: Install the Python package, for the judge
        # conformance/run.py is a codeupipe pipeline (conformance/judging/).
        run: python -m pip install -e packages/codeupipe
      - name: Conformance
        run: python conformance/run.py rust:run
      - name: The oldest Rust that the crate supports (rust-version)
        run: |
          rustup toolchain install 1.75 --profile minimal
          cargo +1.75 test --offline -p codeupipe

  rust-lint:
    name: Rust linter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/codeupipe-lint-rs
    steps:
      - uses: actions/checkout@v5
      # A workspace of its own: it downloads syn and serde_json from
      # crates.io, at the versions in its Cargo.lock.
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: The linter on the Rust code of this repository
        run: >-
          cargo run --locked -q -- --strict src tests ../codeupipe-rs/src
          ../codeupipe-rs/examples ../codeupipe-rs/tests ../../conformance/runners/rust/src
          ../codeupipe-compile-rs/src ../codeupipe-compile-rs/tests ../codeupipe-compile-rs/examples
          ../codeupipe-add-rs/src ../codeupipe-add-rs/tests
      - name: The oldest Rust that the crate supports (rust-version)
        run: |
          rustup toolchain install 1.75 --profile minimal
          cargo +1.75 test --locked

  rust-compile:
    name: Rust compiler
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/codeupipe-compile-rs
    steps:
      - uses: actions/checkout@v5
      # A workspace of its own: it downloads syn, quote and prettyplease
      # from crates.io, at the versions in its Cargo.lock.
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Compiled against the pipeline (numbers only)
        run: cargo run --locked --release -q --example bench
      - name: The oldest Rust that the crate supports (rust-version)
        run: |
          rustup toolchain install 1.75 --profile minimal
          cargo +1.75 test --locked

  go:
    name: Go package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The package and the runner have no dependencies, and no go.sum to
      # cache. Only staticcheck, a tool, is downloaded.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Format
        run: test -z "$(gofmt -l packages/codeupipe-go conformance/runners/go packages/codeupipe-add-go)"
      - name: Vet
        run: |
          (cd packages/codeupipe-go && go vet ./...)
          (cd conformance/runners/go && go vet ./...)
          (cd packages/codeupipe-add-go && go vet ./...)
      - name: Staticcheck
        run: |
          (cd packages/codeupipe-go && go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...)
          (cd conformance/runners/go && go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...)
          (cd packages/codeupipe-add-go && go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...)
      - name: Tests
        run: |
          (cd packages/codeupipe-go && go test -race ./...)
          (cd packages/codeupipe-add-go && go test -race ./...)
      - name: Example
        working-directory: packages/codeupipe-go
        run: go run ./examples/pricing
      - name: Install the Python package, for the judge
        # conformance/run.py is a codeupipe pipeline (conformance/judging/).
        run: python -m pip install -e packages/codeupipe
      - name: Conformance
        run: python conformance/run.py go:run
      - name: codeupipe add, judged by the cases of conformance/ADD.md
        run: python conformance/add.py go:add
      - name: The oldest Go that the packages support (go.mod)
        env:
          GOTOOLCHAIN: go1.22.12
        run: |
          (cd packages/codeupipe-go && go test -race ./...)
          (cd packages/codeupipe-add-go && go test -race ./...)

  rust-add:
    name: Rust codeupipe add
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/codeupipe-add-rs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # A workspace of its own. Its one download is yaml-rust2, for
      # --layout, at the versions in its Cargo.lock. The judge runs the Rust
      # linter on what the command makes, so its crates are fetched too.
      - name: Fetch the crates
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: |
          cargo clippy --offline --all-targets -- -D warnings
          cargo clippy --offline --no-default-features --all-targets -- -D warnings
      - name: Tests
        run: cargo test --offline
      - name: Install the Python package, for the judge
        run: python -m pip install -e ../codeupipe
      - name: codeupipe add, judged by the cases of conformance/ADD.md
        run: |
          cargo fetch --locked --manifest-path ../codeupipe-lint-rs/Cargo.toml
          python ../../conformance/add.py rust:add
      - name: The oldest Rust that the crate supports (rust-version)
        run: |
          rustup toolchain install 1.75 --profile minimal
          cargo +1.75 test --offline

  export:
    name: Export against dynamic run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/codeupipe -e packages/codeupipe-lint -r requirements-dev.txt
      - name: 2,000 random pipelines
        run: python -m scorecard.differential --count 2000

  packages:
    name: Build and install the packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the wheels
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps -w dist packages/codeupipe packages/codeupipe-lint packages/codeupipe-add
      - name: Install the wheels in a new environment
        run: |
          python -m venv /tmp/installed
          /tmp/installed/bin/python -m pip install dist/*.whl
      - name: Use the installed packages, outside the repository
        working-directory: /tmp
        run: |
          /tmp/installed/bin/python -c "import codeupipe, codeupipe_lint; print(sorted(codeupipe.__all__))"
          /tmp/installed/bin/python -m codeupipe_lint.invariants --rules
          /tmp/installed/bin/python -m codeupipe_lint.anonymous_steps --rules
          mkdir /tmp/added && cd /tmp/added && /tmp/installed/bin/codeupipe-add filter Discount
          /tmp/installed/bin/python -m codeupipe_lint.invariants --strict discount_filter.py

  benchmark:
    name: Benchmark (numbers only, never fails the run)
    runs-on: ubuntu-latest
    # A shared CI machine is too noisy to judge speed, so nothing here is
    # compared with a baseline. The job measures and keeps the numbers: in
    # the job summary and as an artifact.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/codeupipe -e packages/codeupipe-lint -r requirements-dev.txt
      - name: Measure
        run: |
          set -o pipefail
          python conformance/bench.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: conformance/results/bench-latest.*
